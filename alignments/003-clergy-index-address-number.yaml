## ————— КАНДИДАТ НА ДРУГОГО СВІДКА (ще не клітинка) —————
candidate_be:
  source: >
    Ф. Скорина, Апостол, Вільна, березень 1525 («Дьяния и посълания
    апостольская зовемая Апостолъ»). Видання Апостола (Praxapostolos) у
    цій друкарській традиції зазвичай несуть власний апарат покажчика
    читань (покажчик зачал Апостола, «Сказание»/«Соборник») — та сама
    конвенція початкової/кінцевої частини, що й у Тетраєвангелії. Це
    жанрово правдоподібний кандидат, не підтверджений.
  access_status: >
    ЗАБЛОКОВАНО, підтверджено двома незалежними механізмами 2026-09-08.
    Прямий curl (не лише інструмент фетчу) на rusneb.ru повертає
    сторінку-заглушку з власним заголовком «Отключите VPN — НЭБ» — це
    підтверджений мережевий/гео-блок, не бот-захист і не авторизація.
    raruss.ru завершується провалом на рівні TLS
    (SSL_ALERT_UNRECOGNIZED_NAME) — другий, незалежний збій. Існують
    два реальні наукові видання (Rothe та ін. 2002, факсиміле+коментар;
    НББ Мінськ 2016, повне факсиміле), обидва інституційні/паперові, тут
    не завантажені. Побічна (неперевірена) деталь із вторинного опису:
    загальна передмова Апостола 1525 р. звернена, за свідченнями, до
    широкого мирського читача — це ближче до жанру 002b, ніж до 003; чи
    том також несе апарат-звернення до духовенства, подібне до
    Пересопницького «Сказанія», НЕ підтверджено без первинного тексту.
  next_step: >
    Знайти наукову транслітерацію (паралельну до видання Чепіги 2001
    для Пересопниці) чи факсиміле з розбірливими сторінками апарату,
    ДО пошуку точних форм. Веб-запит проти цих самих заблокованих
    хостів більше не має сенсу — потрібен інституційний/бібліотечний
    шлях до Rothe 2002 чи НББ 2016. Не виводити be-форми з uk-патерну
    чи з уже locked форм передмови Скорини (be-001 тощо — інший жанр/
    свідок).
  do_not: >
    Не трактувати передмову Псалтиря Скорини 1517 р. (be-001/003/005/
    006, уже locked у probe 002/002b) як доказ ДЛЯ ЦЬОГО probe. Той
    самий автор, інша книга, інший жанр — жодної міжжанрової заміни.

