    reason: >
      Книжечка сповідальних формул + проповіді взагалі не має покажчика
      читань — немає жанрового слота книжкового апарату, який цей probe
      міг би перевірити в цьому свідку. Це СТРУКТУРНА відсутність
      (не той тип книги), не текстово-залежний бар'єр і не доказ про
      граматику sl.
  - language: lt
    witness: молитви Вільнюса / Катехизис Мажвіда 1547
    reason: >
      Збірка молитов і катехизис — не богослужбові видання Євангелія/
      Апостола і не несуть апарату покажчика читань. Те саме структурне
      виключення, що й для sl, з тієї самої причини (не той жанр книги,
      не мовна прогалина — lt уже показує обидва числа деінде, див.
      002b).
  - language: sa
    witness: н/д у поточному корпусі
    reason: >
      Не оцінено. Чи має якась санскритська богослужбова/ритуальна
      традиція структурно порівнянний жанр «як користуватися цим
      покажчиком/таблицею» — відкрите питання, що потребує власного
      дослідження, не припускається відсутнім. UNTESTED, не виключено.

