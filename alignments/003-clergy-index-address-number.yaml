# Probe 003 — звернення в апараті покажчика читань до духовенства, ЧИСЛО
# Версія схеми: 0.1
# Pre-locked ДО подальшого пошуку свідків (method/evidence.md)
#
# Примітка про статус: у цього probe наразі ОДИН заблокований свідок
# (uk). Подається як каркас probe, не результат — за method/evidence.md
# і чинним правилом проти просування equal cells з вторинного опису,
