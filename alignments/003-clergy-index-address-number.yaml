probe-schema: 0.1
probe_id: "3"
title: >
  Число наказового способу (2ОД проти 2МН) в інструкції апарату
  покажчика читань, зверненій до духовенства (кириличні богослужбові
  Євангелія/Апостоли XVI ст., початкові/кінцеві частини)

question: >
  У специфічному жанрі власного апарату покажчика читань друкованої чи
  рукописної богослужбової книги («Сказаніе о главах и зачалЬх» чи
  еквівалент, що пояснює користування таблицею зачал) — чи слідує число
  наказового способу за рамкою адресата (назване множинне духовенство
  проти звуженого однинного «брате») так само, як probe 002b виявив для
  звернення до мирського читача, і чи цей патерн внутрішньотекстовий,
  міжсвідковий, чи обидва?

